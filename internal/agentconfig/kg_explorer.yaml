# kg_explorer: per-agent tier + prompt config (ADR-254 D2 / R23; ADR-227 reveal
# model call, ex chora-fog-orchestrator concept_suggestion).
#
# AGENT-DRIVEN tiering: this YAML declares the explorer's TIER and its prompt
# template version. The model itself is env-only: boot reads the REQUIRED
# KG_EXPLORER_MODEL env var as the gateway's logical_model_id and the optional
# KG_EXPLORER_FALLBACK_MODELS comma list as the agent-declared fallback chain
# (InvokeRequest.fallback_logical_model_ids); the gateway HONOURS it. Boot fails
# loud when KG_EXPLORER_MODEL is unset, so no literal model name lives here or
# in the code.
#
# The explorer proposes up to six concepts and six typed edges from a supplied,
# entitled atom catalogue: a structured, short, catalogue-bound completion where
# the fast tier is the right one. prompt_version labels the embedded default
# template (internal/agent/prompt.go, ADR-197 embedded-default register).
agent: kg_explorer
sub_agents:
  explorer:
    tier: standard
    prompt_version: v2
